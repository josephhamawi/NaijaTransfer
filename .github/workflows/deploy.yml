# ─────────────────────────────────────────────────────────
# NigeriaTransfer — CI/CD Pipeline
#
# Quality gate only. Deployment is handled by Firebase App Hosting,
# which watches the `main` branch, runs its own Cloud Build, and rolls
# out to Cloud Run. There is no VM to ssh into.
#
# Keep the `push` trigger enabled: App Hosting will deploy whatever
# lands on main whether or not these checks pass, so this is the signal
# that tells you a bad rollout is coming.
# ─────────────────────────────────────────────────────────

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy public keys for CI build (prerendering needs them to not crash)
  NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "ci-placeholder"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: "naijatransfer"
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "ci-placeholder"
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "ci-placeholder"
  NEXT_PUBLIC_FIREBASE_APP_ID: "ci-placeholder"
  NEXT_PUBLIC_APP_URL: "https://nigeriatransfer.com"

jobs:
  # ─── Quality checks ─────────────────────────────────
  quality:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:run

  # ─── Build ──────────────────────────────────────────
  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

  # ─── Deployment ─────────────────────────────────────
  # Firebase App Hosting deploys from the `main` branch on its own:
  # it builds with Cloud Build using apphosting.yaml and rolls out to
  # Cloud Run. Nothing to do here. Watch a rollout with:
  #
  #   firebase apphosting:backends:list --project naijatransfer
  #
  # After any backend change, confirm nothing is billing while idle:
  #
  #   bash scripts/audit-cloud-cost.sh naijatransfer
