# ─────────────────────────────────────────────────────────
# Firebase App Hosting — NigeriaTransfer
#
# Replaces the Hetzner VM (PM2 + Caddy + server.js). App Hosting builds
# this Next.js app and runs it on Cloud Run behind Google's CDN.
#
# COST: minInstances MUST stay 0. One warm Cloud Run instance bills
# ~$25–40/month doing nothing, which is more than the VM this migration
# is meant to kill. maxInstances is the hard ceiling on compute spend —
# requests past it queue instead of scaling the bill.
#
# Secrets live in Secret Manager, never in this file:
#   firebase apphosting:secrets:set paystack-secret
#   firebase apphosting:secrets:grantaccess paystack-secret --backend <id>
# ─────────────────────────────────────────────────────────

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  # Zip streaming in /api/transfer/[code]/download-all can run long.
  # Cloud Run allows up to 3600s; 900s is enough for a large zip and
  # bounds the damage of a stuck request.
  timeoutSeconds: 900

env:
  # ─── Public Firebase config (needed at build AND runtime) ──────
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: naijatransfer
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: naijatransfer.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: naijatransfer.firebasestorage.app
    availability: [BUILD, RUNTIME]
  # Plain values, not Secret Manager entries.
  #
  # The Firebase web config is public by design: every one of these
  # values is compiled into the client bundle and visible to anyone who
  # opens devtools. Google documents them as not secret. Routing them
  # through Secret Manager would mean provisioning three secrets, and
  # granting the backend access to them, to protect nothing — while the
  # things that ARE secret (Paystack, Brevo, Termii, CRM) sit below.
  #
  # What actually guards the data: firestore.rules, storage.rules and
  # App Check.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBN40HthOqrmDJkAv23oo7DIfiBFsCIZmY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "534351539159"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:534351539159:web:b23dd541f71d95ea42f992"
    availability: [BUILD, RUNTIME]
  # Analytics property id. Carried for completeness — nothing calls
  # getAnalytics(), see src/lib/firebase.ts.
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-MMMKMSG8FB
    availability: [BUILD, RUNTIME]

  # ─── Application ───────────────────────────────────────────────
  - variable: NEXT_PUBLIC_APP_URL
    value: https://nigeriatransfer.com
    availability: [BUILD, RUNTIME]
  - variable: APP_URL
    value: https://nigeriatransfer.com
    availability: [RUNTIME]
  - variable: FIREBASE_STORAGE_BUCKET
    value: naijatransfer.firebasestorage.app
    availability: [RUNTIME]

  # ─── Cost guardrails (see src/lib/egress.ts) ───────────────────
  # Monthly platform-wide egress ceiling in GB. Past this the download
  # routes serve 503 instead of minting signed URLs, so a traffic spike
  # or an abuser cannot run the bill past what revenue covers.
  - variable: EGRESS_BUDGET_GB_MONTH
    value: "150"
    availability: [RUNTIME]

  # ─── Live Send (free tier) ─────────────────────────────────────
  # STUN only. Firebase provides no managed STUN/TURN service, so this
  # names the external dependency explicitly: Google's public STUN
  # servers, free and without an SLA. No TURN relay is deployed — a
  # relay would carry every byte and reintroduce the bandwidth cost
  # this feature exists to remove. See src/lib/live/ice.ts.
  - variable: NEXT_PUBLIC_LIVE_STUN_URLS
    value: "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302"
    availability: [BUILD, RUNTIME]

  # App Check: abuse control on room creation. Leave the site key unset
  # until reCAPTCHA v3 is registered in the Firebase console; the server
  # treats a missing token as soft-failure. Flip ENFORCE to "true" only
  # after real traffic shows valid tokens arriving.
  - variable: FIREBASE_APPCHECK_ENFORCE
    value: "false"
    availability: [RUNTIME]

  # ─── Payments ──────────────────────────────────────────────────
  #
  # Secret names match what already exists in Secret Manager. They are
  # SCREAMING_SNAKE, not kebab-case — a rollout referencing a secret
  # that does not resolve fails outright, so these have to be the real
  # names rather than a convention.
  - variable: PAYSTACK_SECRET_KEY
    secret: PAYSTACK_SECRET_KEY
  - variable: PAYSTACK_PUBLIC_KEY
    secret: PAYSTACK_PUBLIC_KEY
    availability: [BUILD, RUNTIME]
  - variable: PAYSTACK_WEBHOOK_SECRET
    secret: PAYSTACK_WEBHOOK_SECRET
  - variable: PAYSTACK_PRO_PLAN_CODE
    secret: PAYSTACK_PRO_PLAN_CODE
  - variable: PAYSTACK_BUSINESS_PLAN_CODE
    secret: PAYSTACK_BUSINESS_PLAN_CODE

  # ─── Email / SMS ───────────────────────────────────────────────
  - variable: BREVO_SENDER_EMAIL
    value: noreply@nigeriatransfer.com
    availability: [RUNTIME]
  - variable: BREVO_SENDER_NAME
    value: NigeriaTransfer
    availability: [RUNTIME]
  - variable: TERMII_SENDER_ID
    value: NigeriaT
    availability: [RUNTIME]
  - variable: CRM_ENDPOINT
    value: https://api-ei3nxpoa5q-uc.a.run.app
    availability: [RUNTIME]

  # ─── Not yet in Secret Manager ─────────────────────────────────
  #
  # Commented out deliberately. App Hosting fails an entire rollout if
  # any referenced secret cannot be resolved, so leaving these in would
  # guarantee a failed first deploy rather than a working app with
  # degraded email.
  #
  # Create each one, then uncomment the matching pair:
  #
  #   printf '%s' "$BREVO_API_KEY"  | gcloud secrets create BREVO_API_KEY  --data-file=- --project naijatransfer
  #   printf '%s' "$TERMII_API_KEY" | gcloud secrets create TERMII_API_KEY --data-file=- --project naijatransfer
  #   printf '%s' "$CRM_APP_ID"     | gcloud secrets create CRM_APP_ID     --data-file=- --project naijatransfer
  #   printf '%s' "$CRM_API_KEY"    | gcloud secrets create CRM_API_KEY    --data-file=- --project naijatransfer
  #   firebase apphosting:secrets:grantaccess BREVO_API_KEY --backend <id> --project naijatransfer
  #
  # Impact while missing: transfer notification emails and phone OTP do
  # not send. Uploads, downloads, Live Send and payments are unaffected.
  # CRM tracking already no-ops when unset by design.
  #
  # - variable: BREVO_API_KEY
  #   secret: BREVO_API_KEY
  # - variable: TERMII_API_KEY
  #   secret: TERMII_API_KEY
  # - variable: CRM_APP_ID
  #   secret: CRM_APP_ID
  # - variable: CRM_API_KEY
  #   secret: CRM_API_KEY
